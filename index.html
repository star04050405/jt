<script>
var DATA=[{"t": "井塘古村解说词", "route": "游览路线：土地庙——小钱塘——古井——仪凤桥——民间信仰院落——豆腐坊——衡王嫁女史话馆——围堰院——打水道子——张家大院——夫妻槐——下碾院——石板院——南碾——孙家老宅——南哨门——吴家大院", "s": ["井塘古村地处沂蒙山脉北向延伸段玲珑山北坡，属低山丘陵区，平均海拔在280米左右。", "气候属北温带亚湿润区，大陆性季风性气候明显，年平均气温12.8℃，无霜期192天，年降雨量平均740mm左右。", "改革开放后，村民相继从交通不便的老宅迁出。", "搬迁后，使得明、清、民国、建国初、“文革”等不同历史时期的建筑或遗址，相对完整的保留了下来，民俗文化也得到较好地保护和传承。", "古村、过渡区和新村各具特色，相互交映，绘就了井塘的传奇与魅力。", "2011年，青州市委市政府为保护井塘古村落群，承续传统文化，成立青州市井塘古村旅游项目建设指挥部，全力搞好井塘古村的基础配套建设。", "2012年，井塘古村景区正式对外开放。", "井塘古村位于山东省青州市区西南15公里处，现隶属王府街道办事处。", "明景泰七年（1456年）井塘吴姓由青州二龙山北侧的吴家井迁来定居，至今已有500多年历史。", "村落依山而建，依托仪宾府院落，形成了具有明代建筑风格又兼具西部山区居住特色的古建筑群，是山东省内保存比较完好的一处古村落。", "井塘古村与周围其他村庄一样，都是以农耕为主，所不同的是明代青州第三代衡王朱载圭的三女儿下嫁该村吴姓子弟，从此井塘村盖起了规模宏大的仪宾府（仪宾为衡王女婿的代称）。", "仪宾府相当于当地最大的“地主”，坐拥方圆十几里内的许多土地，有农林牧管理系统、武装自卫系统、教育医疗系统以及银号等。", "从仪宾府到衡王府还曾修了两条官道，一条为沿南阳河走的官道，一条为沿南闫、张家峪走的官道。", "由于仪宾府与青州衡王府特殊关系，清朝推翻明朝政权后，仪宾府也受到牵连，在康熙五年被查抄。", "正因如此，大分部实物和资料没有传续下来。", "现在仅存有的实物只剩当时仪宾府的管家院、地窖、石桥、古井、古庙、古道、石狮、古槐等。", "现在井塘古村有吴、孙、张三大姓，500多户，1627人。", "耕地1000多市亩。", "主要收入来源为耕种、山果、果品加工和外出务工，该村是全国最大的山楂片加工基地。"], "n": 797}, {"t": "土地庙", "route": "", "s": ["这里原有土地庙、三官庙等同在一个院落内，北屋三间供奉三官，西屋供土地爷。", "文革期间院落和庙宇已全部塌毁，现在的土地庙是在2011年按原貌复建。", "土地庙是村里的社庙。", "老人们认为，人死后，要去土地庙报到，然后由土地老爷带领死者的灵魂去超生的地方接受审判。", "最早管理死者的是泰山府君，后来转为阎王爷，死者只有经过泰山府君或阎王爷的审理后，灵魂才能够升天、入地，或者转生。", "直到现在村民逢丧事时还要到这里来“送大纸”、“送盘缠”。"], "n": 207}, {"t": "小钱塘", "route": "", "s": ["原为仪宾府的养鸭湾，又名“小钱塘”， 据说是张家祖先张泓，明末从浙江省钱塘县迁到井塘时，为纪念故乡而命名。", "后来在景区开发时，将坝体加高加宽，就成了现在的模样。", "村庄有生日？", "你大概没有听说过吧。", "1930年农历四月二十日凌晨四点，土匪攻打井塘村，村民奋起反击，击退来敌，村民共议，定免遭涂炭之日为井塘生日。", "在一九三〇年古历四月二十日夜，井塘村被土匪包围了。", "这里面有土匪头子雇佣的一些南军约200余人，他们带着枪，背着刀，刀把上有红绸子。", "土匪头子站在纱帽上观阵，黎明时岗楼上的人发现土匪围了庄，立时鸣枪报警，民团立刻带上武器上了围墙炮楼，开始了战斗。", "离土匪远的用快枪打，近的用抬枪、土炮、手榴弹打。", "最激烈的战斗，在四月二十7-8点，枪声响成一片，犹如年五更放鞭炮一样。", "这场保卫战，在团总吴光祖和团部的统一指挥下，村民们凭借围墙的防护进行了英勇的还击，战斗持续到上午九点多，有人要求开北门逃命，幸亏吴继谦，用身子挡着北门，坚决不让开门，若是开了北门，人一涌而出，可能一个活的也没有。", "在这种情况下，团部立即采取措施，调整兵力，关闭各街巷口的寨门，硬是把攻进来的土匪压在一条胡同而全歼。", "其余攻进来的土匪又被打出村去。", "过午之后，枪声稀落，土匪要求讲和，团部准许，有5名土匪在团部提出的条件上签字、画押，保证不在再侵犯井塘，由吴光祖、吴传经、吴延和等人持枪押送土匪出村。", "土匪边走边说：“人是一句话，神是一柱香，说不打就不打。", "”押送到古街时，街两边站满了持枪的民团，要求将这些土匪打死在这里。", "吴光祖坚决制止住，才没有开枪，吓得土匪跪地叩头，仍说：“人是一句话，神是一柱香，说不打就不打。", "”众土匪败走时，团部在他们的哀求下，给了他们三支没枪栓的破枪。", "井塘修围墙，用来防御土匪，取得了胜利。", "规模虽小，作用相同。", "土匪打井塘，就因为这道围墙，也才没有得逞。", "这次战斗，打死打伤土匪数十人之多，据说，土匪回去后，被南军枪毙了四个土匪头子。", "井塘村保卫战后，本村有了一首民谣，记载这次战事：“打了井塘庄，胡子遭了殃，插了王老七，扁了窦宝章，下了王大告的枪。", "”\n在井塘村与土匪的对抗中，吴光祖功不可没。"], "n": 882}, {"t": "古井", "route": "", "s": ["此井原本为泉，水出岩窦，常涌不竭。", "明末村人骤增，水欠缺，遂凿石下挖十米，折东掘近半米，又下凿二米，聚得泉源，上甃石八米成井。", "井深20米，由于处在山体断层，常年有水，水质清凉甘冽。", "目前来看，井口石已换到第三个了，前两个井口石因年久已坏，垒在了西边墙上。", "井口上磨出的深深的印记是村民们提水时用井绳磨出来的，最深的可达七八厘米。", "如果仔细比对这三块井口石，您会发现第三块井口石口略高，这样做有效防止打出来的脏水倒流回井里。", "虽然只是一个小小的设计理念，却让我们深刻的感受到劳动人民无穷的生活智慧。", "自古以来，这口井就是村民们的主要生活水源，因其常年不竭，在大旱之年，附近十几个村庄也都来这里打水吃。", "井边有一方蓄水的池子，井水透过甃石溢出，流入池子，村里人把它叫做“塘”，从塘里不断有水穿孔外溢，形成一瀑布，注入小溪。", "因为井和池塘紧连，初名“井塘峪”，后改为“井塘”，沿用至今。"], "n": 382}, {"t": "仪凤桥", "route": "", "s": ["“仪凤桥”以及北边的“兴隆桥”，都是明代修建的石拱桥，样式相同。", "两座桥修好后都曾立碑并放置在关帝庙院内，上面记载了修桥捐款、出工、管饭、塌桥等事项，可惜“文革”时期被推倒，碑帽被放置到了桥头，碑神被砌在了井旁边的池塘台子上，南北放的是兴隆桥的石碑，东西放的是仪凤桥的石碑。", "由于刻有碑文的一面朝上，日久天长，村民打水时频繁的摩擦已将碑面磨得平滑，只剩下兴隆桥的“興”字半边，以及仪凤桥碑文残存的数字了。", "兴隆桥在200多年前古历七月二十三下涝雨时被三股水汇合成流冲毁，现在的兴隆桥是用三块大条石铺成，名字也改成“小桥”了。", "为什么一个小小的村庄在封建王朝时期敢用“仪凤”、“兴隆”这样具有皇家之气的词给桥命名呢？", "那就不得不提到明代在青州做藩王的衡王了。", "明朝朱元璋为了加强集权统治，建立了同姓诸王分封制度，青州为军事重镇，先后有齐王、汉王、衡王封于青州，其中，衡王的历史最长，影响最大。", "这两座桥就是当年的第三代衡王朱载圭嫁女时所修。", "据传，朱载圭生了三个女儿，大女儿嫁给在京做官的一家大户，过门三年男人就吐血死了，年轻守寡，日子难熬，她每次回娘家都要对父母哭一场。", "二女儿嫁一个官宦子弟，封为郡主，尽管吃的是山珍海味，穿的是绫罗绸缎，可惜男人是个面黄肌瘦的病殃子，二女儿回到王府也常常长吁短叹。", "三女儿看在眼，多了个心眼儿，将来要找个身体健康的夫婿，到了待嫁年龄，父母给她择偶，她不依，说泰山老母托梦，叫她抛彩球选女婿，朱载圭信佛，只好依从了，结果三女儿看中了井塘村身体健壮的吴姓青年，并将绣球抛给了他。", "衡王后来知道姓吴的小伙子是个家无片瓦的穷汉，后悔不迭，但也于事无补。", "于是衡王给女儿分割了很大一片领地，在井塘村给她盖了亭厅堂瓦舍72间。", "为了嫁女，还修了一条从府城直通井塘村的大路。", "这条大道全部用大青石板铺成，从青州的衡王府城出发，沿途经过各个村子，如今在井塘的邻村张家峪、南闫村都还保留了一大段当时修的青石板路，这两座桥就是那时修的。", "而公主下嫁正是有凤来仪，故桥名分别命名为“仪凤桥”、“兴隆桥”。"], "n": 844}, {"t": "民间信仰院落", "route": "", "s": ["关圣祠，明代万历年间建，是为纪念三国时名将关云长显圣助邢玠破倭寇而建。", "关圣祠是祭祀关羽的祠堂，石构无梁殿，券门，整石镂孔窗，内供关羽、周仓、关平彩塑像。", "建国后，塑像被毁，祠前的两株二十多米高、四人合抱的古松也在文革浩劫中被伐。", "院内立有建于明代的“天地牌位”，高2.5米左右，宽1.2米左右，上刻“天地三界十方万灵真宰”，是国内最大的石质天地牌位。", "2000年，在村民吴兆信、孙全道等人的倡议下，由全村人共同筹资重新塑像刻碑。", "关圣祠修复后，村里规定了4个上香的日子：3月15（春祭）、6月24（关老爷的生日）、9月9（秋祭）、10月15（冬祭）。", "6月24关老爷生日时，这里有隆重的庙会，附近村庄的村民也会来参加。", "此外，5月13日是关老爷磨刀的日子，方圆10公里的人都来上香。", "除这四个固定上香的日子，平时村民也会常来许愿、祭祀。", "为什么这里的村民特别信奉关老爷呢？", "据传说关老爷曾经显灵保护村民。", "抗日战争期间，日军侵占青州，扫荡村庄，民不聊生。", "有一年来的善男信女正在关圣祠上供，虔诚的上香跪拜，快到中午时，其中一人忽然拍着手从大殿西头跳到东头，往复数次，大声说“日本鬼子要来咱庄了，为了百姓不受惊吓，快给俺三匹马，俺要镇住鬼子，保护村庄，不让他们横行。", "”大家听后，凑钱找纸匠扎了一匹红马、一匹白马、一匹黑马，钱粮若干，供品丰盛，香烛排全，在关圣祠前上供求平安。", "十多天后，日本鬼子扛着枪炮从纱帽山过来，穿村而过，往西去了，竟没有骚扰村民，什么事也没有。", "村民认为这是关老爷显圣救了这一村的老百姓。", "事后，村中男女老少都到关圣祠前上大供，答谢关老爷的大恩大德。", "无生老母祠遗址，位于关圣祠左前侧，清末建，为起脊瓦陇建筑，内塑无生老母、四季老母像，后被毁。", "老母庙原来单独成院，三个庙中，老母庙盖的最晚，约建于明末清初，面积约十二三平方米，约3米高，坐北朝南，祠中供奉五个神像，居中的是贴金脸的无生老母，两边分别供奉春夏秋冬四季老母，1949年老母庙中所有的神像都被毁掉，1958年无生祠也被拆毁，遂被弃用。", "从庙里供奉的神像可知，这里既有四季神，也有老母像，是一座组合式神庙。", "这种一庙多神的供奉方式，也是村民节俭的体现。", "龙王庙，始建于明末清初，供奉龙王，全石板结构，“文革”时被毁，2012年复建，内塑龙王像。", "龙王庙高约2米，庙门高半米。", "过去井塘村祈雨时要到龙王庙，周围村庄也要来。", "最后一次祈雨是20世纪80年代末90年代初，那年大旱，玉米绝产，井塘村东的张家峪村挑头求雨，井塘村也一起参加。", "张家峪村来求雨时，打着锣，抬着轿，轿是扎的，里面还有龙王牌位。", "后又从本村上了玲珑山顶的瑶池。", "井塘村共有三个香社组织，分别是一个玉皇社和两个四季社，而老母庙主要是四季社的活动场所。", "井塘村四季社的历史非常悠久，凤凰山上有块立于民国八年的四季社碑刻，碑刻的题名中便有井塘村村民。", "井塘村的四季社原为一个社，后来随着部分村民迁往鞍子口西居住，而原四季社主要在鞍子口东活动，于是，鞍子口西的村民又重新起社，使原来的一个四季社分为如今的两个。", "四季社供奉无生老母和四季老母（四季老母的说法不一，其中一种说法是春季为观音老母，夏季为清凉老母，秋季为文殊老母，冬季为普贤老母）。", "每逢四季交接之时（立春、立夏、立秋、立冬），举行“接季”活动。", "接季时供奉有神轴，神轴上面从上至下依次绘有无生老母和四季老母的神像，神轴两边挂的条幅为八仙的画像，社友在接季活动时普遍“念佛”，就是大家一起唱经，非常好听，犹如天籁之音。", "为什么当地会有此信仰？", "当地流行的说法认为，无生老母和四季老母是姐妹，都是王母娘娘的女儿，其中无生老母最小，她的本事却最大，她能解决人们所遇到的任何问题，而村民们信奉了这些神灵就是行好，做好事。", "村里信奉老母的人很多，他们除了定期接季外，平时没事儿了，或者农闲时、刮风下雨时就聚在一起念佛，相互交流学习，而不是去打牌打麻将或者闲逛，她们觉得这样很高兴。", "老母庙还没有被毁坏时，社友们就在老母庙接季，现在是在社友家里接季。"], "n": 1636}, {"t": "豆腐坊", "route": "", "s": ["井塘村至今还保留着传统的用卤水点豆腐的工艺，制作时，先把豆子压成餷子去皮，然后用水泡透，再用石磨磨细成糊，用细布做成布袋，将糊装入，挤压留浆去渣，放入锅中烧开，点适量卤水成豆脑，放入包袱中挤压去水而成。"], "n": 101}, {"t": "衡王嫁女史话馆", "route": "", "s": ["这里展示了与衡王嫁女相关的许多传说故事，第三代衡王有三个女儿，长女封为寿光郡主，次女封为章邱郡主，三女系郭氏所生，封为房山主。", "三女儿到了谈婚论嫁的年龄向衡王提出：“不论贫富，我要挑一个能吃能喝没病的人作为自己的丈夫。", "”春天，衡王在青州四城门贴榜，设宴招婿。", "吉期临近，衡王夜得一梦，见一彩凤从西南方飞来，飞累了，落在王府前歇息，其王妃郭氏与其梦境相同，次日与内掌（管家）谈及此梦。", "内掌（管家）说：“恭喜王爷，必得佳婿。", "”这一天衡王府悬灯结彩，设宴盛席，准备选佳婿。", "官宦子弟也有骑马的，也有坐轿的，陆续而至，都愿意高攀这门亲事。", "待客厅内坐满了前来应选的人，依次序而坐，独有正座空着无人敢做。", "再说井塘这位卖柴的吴猛青年。", "家贫，父早丧，对母亲极为孝敬。", "虽是卖柴为生，却缺不着母亲的膳食。", "这一日早起，用过粗茶淡饭，挑着一百多斤的柴担，来青州城里柴市卖柴。", "有一店主买下，让他送至店内支钱。", "吴猛送至店内过秤得钱，店主说：“小吴呀，今天衡王府设宴招亲，你何不去试试？", "”吴猛说：“我是个卖柴的，不敢高攀。", "”店主说：“就是选不上你，也吃他顿饭，省下你卖柴的钱，多买斤粮食有何不可呢。", "”吴猛说：“我穿的这么破衣褴衫的，人家能让我进门吗？", "”店主说：“我借给你一身衣服。", "”穿戴整齐，洗面梳发后，果然人才出众，不似刚才卖柴的样子。", "衡王问内掌（管家）：“客人到齐了吗？", "”管家说：“未到齐。", "”连问数次，正座上无人，客不齐。", "吴猛穿戴好以后急忙忙来到王府门前，守门人问：“你来干啥？", "”答曰：“相亲。", "”守门人问他要钱，吴猛说：“我卖担柴能得多少钱，还得买粮回家侍奉母亲，哪有钱给你。", "”正在拉扯之间，管家从里边出来，看看还有没有前来的人。", "看见这个场景，便问：“你们这是干啥？", "”吴猛说：“我是前来应选的，这些人问我要钱，我没有，他们不让我进门。", "”管家说：“进来吧，别听他们的。", "”吴猛来到客厅，只见还有一个座位，就顺便坐下。", "管家说：“客人全了，上菜上酒。", "”吴猛又饥又累又渴，在家中也未见过这样丰盛的酒菜，便大吃大喝起来。", "三姑娘在对面楼上，看得真切，其他座上的人星星点点得吃，也有不吃的，唯有正座上这人狼吞虎咽，大吃大喝。", "三姑娘便对母亲郭氏说：“就是正座上这人，请母亲和王爷说，先问问他家有什么人，有没有妻室。", "”\n酒足饭饱之后，管家来到吴猛面前，说：“王爷口谕，命你前去晋见他。", "”吴猛说：“我没做错事，就是来吃了顿饭，怎么不叫别人，单叫我去晋见王爷？", "”管家说：“别害怕，见到王爷，问你什么你就如实的说。", "”吴猛随管家来到衡王面前，跪下磕头，说：“小人有罪，请王爷饶恕。", "”衡王说：“起来吧，你何罪之有，别害怕。", "我问你，你要实说。", "”管家搬过座椅让吴猛坐下。", "衡王问：“你姓啥？", "”吴猛说：“回王爷话，小人姓吴。", "”“多大了？", "”“小人今年22岁。", "”“你是哪里人？", "”吴猛说：“小人是城西南井塘庄人。", "”“在家干啥？", "”吴猛说：“回王爷的话，小人在家以打柴为生计。", "”又问：“你家中有什么人？", "”吴猛说：“回王爷的话，先父病故，只有我和母亲。", "”衡王又问：“可曾定下妻室？", "”吴猛说：“回王爷的话，小人家穷，无力攀亲。", "”衡王说：“今天三女挑中了你，你可愿意？", "”吴猛说：“小人家穷，不敢高攀。", "”衡王说：“你愿意就愿意，不愿意就说不愿意，不管家穷家富。", "”吴猛说：“我很愿意，就是怕家穷让皇姑受委屈。", "再说我同母亲住着两间草房，没地方让皇姑住。", "”衡王说：“没屋，咱可再盖，无钱，我可以帮你。", "但这亲事是人一辈子的终身大事，不能马虎。", "”吴猛说：“既然王爷和三皇姑不弃小人穷、微贱，小人非常愿意。", "”衡王说：“就这么定了，不许反悔。", "”\n衡王差四个家丁骑马来井塘报喜，找到吴母把他儿子被三皇姑选中、被衡王招为女婿的事详细说明。", "吴母非常高兴，说：“谢天谢地，谢王爷大恩，我也不为儿子的婚事发愁了。", "”说着把四个人让进小屋里，倒茶相敬，并说：“你们先喝着茶，我有点事，一会儿就回来。", "”吴母来到邻居家说明原因，并说：“你先借点钱给我，人家大老远的，来到我家报喜，不能叫人家空跑腿，给点喜钱，别叫人家说我庄户老婆子不懂礼。", "”邻居听说，马上拿出钱借给吴母。", "吴母回家对四个报喜的说：“微薄之礼，不成敬意，望你们收下买茶喝。", "”四人谦让一会儿，收起钱，回王府复命去了。", "吴母在家中的佛堂内上香，感谢神佛保佑的大恩。", "衡王即时拨银子，让管家来井塘买地、盖屋，历时数载，在井塘盖了三十二座楼，七十二口瓦屋，花园、马厩、粮仓，一应俱全。", "前后三条街，四周有围墙，办公地点就是现在吴兆贵住的家，大门口的过门石仍存，南墙还有。", "已故吴其昌的大门口上的挡风板、垂珠雕刻精美，明宜宾府的建筑还剩下这一处宅院，是管家住的地方，这口屋的造型是四梁、八柱、离檐橛子、离檐板子、窗台以上全是青砖。", "离檐板下门窗都雕刻着精美的图案，山墙、后墙都有挑翅，全用砖块垒得非常整齐。", "后墙有密棂的檐窗。", "明朝的遗物还有一个石头狮子，另一个石狮被毁，只有底座。", "还有一个石鼓保存完好，另一个鼓下落不明。", "宅院建好后，名曰宜宾府。", "衡王三女被封为房山主（有资料可寻），有一次回家探亲，她母亲郭氏说：“给你拉上车银子，回家过日子用。", "”房山主说：“俺不缺银子，就是道不好走。", "”郭氏说：“道不好走，咱再修。", "”衡王拨银子，从南门外沿火石山子、朱庄、王庄、张家峪、闫家峪，一直铺到井塘。", "原来的石铺道现存数段，从宜宾府到兴龙桥一段，闫家峪庄里一段，张家峪鞍东侧一段，张家峪庄里一段。", "当时有句话说：城里冯（冯国老名溥）房（房可壮是尚书）二家，不如井塘吴家。", "因吴宜宾是衡王的女婿，和万岁是姐夫舅子的关系。", "清朝康熙五年城里衡王被抄，也株连了宜宾府，来抄宜宾府的是北张楼村在河南邮政县做个县长的李大人。", "此人很仁慈，设法放走了吴宜宾的两个儿子。"], "n": 2327}, {"t": "围堰院", "route": "", "s": ["院子依山坡地势，由南、东、北三面坡底垒石堰墙合围至西面坡顶高度，围堰内填沙土夯筑为基，基上建房成院，故称“围堰院”。", "该院始建于清朝，距今已有四百多年的历史了，历经风雨的洗礼依然保持了原貌，坚固如初。", "井塘村村民建造房屋时就地取材，只用石头垒房子，而不掺加泥或土之类的粘合剂。", "周所周知，方方正正的石头垒房子是比较容易的，但是这里的房屋用的石头是圆形、三角形、梯形等各种不规则形状，要把它们组合成坚固的房子和院墙是非常不容易的，而且房屋的转角并不是直角，而是个圆弧，从这些地方也可以看出人们干插石技术水平之高，而现在，这座干插石技术也被列入了山东省非物质文化遗产名录。"], "n": 281}, {"t": "打水道子", "route": "", "s": ["这条路过去是村民们去古井打水的主要线路，所以就有了这个名字。", "在路边墙壁上还镶嵌着石敢当。", "石敢当是一种石崇拜，在石头上刻“石敢当”或“泰山石敢当”之类的字，立于街巷之中，特别是丁字路口等路冲处被称为凶位的墙上，用来禁压不祥，保家宅平安，还有驱风、防水，辟邪，止煞、消灾等多种功效。", "在中国的农村非常盛行。", "石敢当在井塘村也随处可见，但是不同之处在于，井塘古村中的石敢当上都是刻了七个字“泰山镇宅石敢当”。"], "n": 199}, {"t": "张家大院", "route": "", "s": ["此院是元代曾为官青州的浙江张姓后裔于清初自临朐涝洼村迁来时建。", "张家的大门极为讲究标致，全用青石加工成料，用人工打凿而成，加工精细、标准，是井塘唯一的石料门口，据说当年是张家去李家大峪请刘姓石匠来修盖的。", "当时张家是大户，有钱有粮，地多，房屋修建的自然就好。", "这座标准的四合院，东南大门，北屋为主房，加工很细致，屋前脸全用青石打凿而成。", "这里的门窗使用砖镶，而当时用砖需到三十多里路的青州城东去挑，趟过十三道清水河，来回近七十里，能用得起这种建筑材料，足以见得当时的张家家境什么殷实。", "北屋山把子有挑翅、迎风探头，东边写着“福”字，西边写着“寿”字，寓意“福寿双全”。", "两头有耳房，意思是辅佐北屋这位当家的，这两边的耳房，比北屋主房矮、浅，起君主臣辅作用，东屋比北屋矮，但加工的石料比较细，南屋比东屋矮，西屋比南屋矮。", "西屋南头是栏圈，布局是“东南门，西南圈”。", "四合院的墙全是用石头垒起来的，非常齐整。", "原来张家场园北边土崖头上有两棵很粗的古槐，院西古碾北侧有一棵高大的古槐，枝叶遮着张家大院，当时是极为兴旺的家庭。", "张家先后有十代人在此居住，张成修、张美修、张永修堂兄弟及其子女是最后两代住户，最多时大院中同时有二十余口人一起生活，四代同堂。", "兄弟三人虽同住一院，但各成一家，厕所不共用，五六平方的空间除当厕所外，还要放上石槽、木槽养羊、牛、猪。", "有一段时间曾经因妯娌关系不和，张美修要在北屋后墙上单独开一个门，但门开到一半被大哥制止，门被重新堵上，妯娌间和好如初，于是就有了张家大院“门的故事”时时警示后人。", "他们于1970年代后分别迁至鞍子西。", "目前张家大院内展示的是井塘村的婚俗。"], "n": 681}, {"t": "夫妻槐", "route": "", "s": ["此树根上生二树，树下根连根，因长在土崖年久，土渐失根渐露，裸根化作连理枝，故名“夫妻槐”。", "夫妻槐还有一段传说故事。", "据传，衡王的三女儿下嫁井塘吴宜宾之后，夫妻和睦，相敬相爱。", "时间长了，夫妻之间开玩笑不当回事，一次玩笑，却惹恼了这位金枝玉叶的三姑娘。", "她回衡王府对其母说知：庄户小子看不起我，说我虽是金枝玉叶，和庄户人家没有两样。", "这又激怒了母亲郭氏，晚上她又将女儿的话告诉了衡王。", "王爷大怒，命管家带兵去井塘宜宾府问罪。", "在路上，管家思忖去责打轻了，姑娘出不了气，责打重了，王爷怪罪下来，自己吃罪不起，真是左右为难。", "边走边想，忽然问道，：“你这玩笑话在什么地方说的？", "”三姑娘说：“在床上说的。", "”管家有了主意，说：“在床上什么话也可以说，什么事也可以做，家丑不可外扬，不要让人笑话。", "你俩很可能是命里造着有这一段纠葛，你们找一棵槐树，让槐神爷给你说和说和就好了。", "”管家带上供品、香纸，来到这棵槐树前，上香摆供，夫妻俩跪拜后发纸、奠酒、举行的非常隆重，表现得非常虔诚。", "自此以后，夫妻二人和好如初，非常感谢槐树爷，也留下了一段佳话。"], "n": 457}, {"t": "下碾街", "route": "", "s": ["石碾是一种用石头和木材等制作的使谷物等破碎或去皮用的工具，跟磨是有区别的。", "在景区内有三盘碾，分别是下碾，南碾和北碾，是村里三大家族张家、孙家、吴家置办，供全村人共同使用的。", "这个碾是下碾，也是张家的碾，所以这条小街也叫作下碾街。"], "n": 113}, {"t": "石板院", "route": "", "s": ["此院是孙姓先人将陡峭山体下凿，开挖到一整块面积足够砌房建院的石板面，以此作为基础。", "开出的石材先在地势低处砌墙筑至基础高，再在此上建房院，形成一块石头作天井的“石板院”。", "更有趣的是，在石板上发现人工开凿的大小不等、分布不均的十六个石窝。", "现有星象图说、接地气说、插立柱说三种解释。"], "n": 138}, {"t": "南碾", "route": "", "s": ["该碾为明末清初孙姓迁居井塘后所建，当时还建了石头磨坊两间，距今已有近500年的历史。", "南碾所在的这条路叫“南碾崖子”，这条路是一条双行道的路，左边走车，右边走人，用现在的话来讲就是实现了“人车分流”。"], "n": 99}, {"t": "孙家老宅", "route": "", "s": ["进入孙家老宅看到一堵特殊的墙，叫做“壮汉墙”。", "墙体因地基沉降不均、内部结构变化等导致倾斜、外揣时，在墙体倾斜、外揣部位用石头砌浮墙抵抗之以免倒塌。", "浮墙像一条汉子或一头牛用力扛住墙体，所以形象地称其为“壮汉墙”、“卧牛墙”，又名“壮汉”、“卧牛”。", "孙家老宅始建于清朝，孙家共四代人曾在此居住，清末该院主人孙玉清是远近闻名的内外两科中医，会炼丹。", "现在，孙玉清的后人孙好荣配制的“通络活血膏”“偏瘫复原丸”“续筋接骨膏”被收入青州市非物质文化遗产保护名录。", "孙家老宅现为村史馆。", "村史馆有反映景区及其周边地理地貌的大沙盘，并配有井塘村历史文化等诸多内容或图片。"], "n": 275}, {"t": "南哨门", "route": "", "s": ["南哨门是村子的最南门，出了南哨门就算出了井塘古村了。", "南哨门外风景优美景色宜人，大家往东面看，这座山就是有名的纱帽山，这个名字是很形象的，我们仔细看一下，整个山的形状就像一个古代的乌纱帽。", "此处树木茂盛，植物种类繁多，山清水秀好像世外桃源一般，是井塘村的一块宝地。"], "n": 130}, {"t": "吴家大院", "route": "", "s": ["吴家大院始建于明末清初，吴凌霄家四代人先后在此居住。", "吴凌霄考过科举，家中开过钱庄和酒店，其后人自1960年后分别迁至鞍子西。", "这座吴家大院原是清朝吴俊杰的古宅，有南院、北院、西院（西院又分前后两院），家大业大，是人财两旺之地。", "据传说，吴俊杰田地有60大亩开外，最多时家里雇了32个雇工。", "吴俊杰虽家业大，但男孩少，他便过继一子名叫吴凌云。", "有一年他带着很多钱去青州买了一船活鱼放生，后来得子名叫吴凌霄，字汉章，此人饱读诗书，曾多次下场参加科考。", "有一次，一个举子出银子十两，让吴凌霄替他作份试卷。", "结果此人考中了秀才，而他却没有考中，后来人家聘请他去教书。", "至吴凌霄时家中有六个儿子，开着钱庄，自己可以出钱（通过县商会根据家产的一半出钱）。", "老大吴光斗主事当家，老二吴光彩在家务农，老三吴光烈在家务农，老四吴光文在刘井开酒店，后被土匪绑票并撕票，老五吴光晋、老六吴光美均在家务农，到了40多口人一个锅中吃饭。", "此为最兴旺时期。", "家中有一古老高大的槐树，树冠荫覆全院，有四个人合抱之粗，1975年被伐。", "地多粮广，自家有两犋牛耕地。", "在当时是全村的首富之一。", "据说，他家的酒用大甕盛着，喝不见少，粮食也用大瓮盛着，也是吃不见少，为什么？", "是因为有一家仙辅助他，这个家仙就是黄鼠狼黄大仙。", "据说，吴家有个儿子娶了媳妇后，刚结婚的第二天早上在扫院子，扫完地后，地就起疙瘩了，老人们说，这说明这个人有福，自此以后他家要是晒麦子只会越晒越多。", "但是随着她年龄的增大，运气逐渐衰败，原来黄鼠狼往他家搬粮食，此后就再也不搬了，吴家也开始逐渐衰落。", "但正是因为受了仙家的庇佑，吴家世代要在粮食入瓮时上香，摆供发纸，奠酒请家仙赴席。", "后来为了保证仙家能集中享受祭祀，同时也能满足吴家人能集中进行供奉活动的要求，吴家就在1990年代盖了座简易的仙家庙，每年吴家的人都要来上供祭祀，以求发福生财，保平安。"], "n": 774}];

var cur=-1,lvl=0.2,reading=false;
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1500)}
function stampN(){return DATA.filter(function(_,i){return done[i]}).length}
function renderList(){
 $('segs').innerHTML=DATA.map(function(d,i){
  return '<div class="sg'+(done[i]?' done':'')+'" onclick="openSeg('+i+')">'
   +'<span class="nm">'+(i===0?'概况 · ':'' )+d.t+'</span>'
   +'<span class="st">'+(done[i]?'✓ 背过了':'')+'</span>'
   +'<span class="ct">'+d.n+'字</span></div>';
 }).join('');
 var n=stampN();
 $('pfill').style.width=(n/DATA.length*100)+'%';
 $('pnum').textContent=n+'/'+DATA.length;
 $('meta').textContent='全文 '+DATA.reduce(function(a,d){return a+d.n},0)+' 字 · 已背 '+n+' 站';
 $('route').textContent=DATA[0].route;
 if(n===DATA.length){$('egg').style.display='block'}
}
function openSeg(i){
 cur=i;reading=false;
 if(window.speechSynthesis)speechSynthesis.cancel();
 var d=DATA[i];
 $('dtitle').textContent=(i===0?'':'第'+(i)+'站 · ')+d.t;
 $('dcnt').textContent=d.n+'字';
 $('pane-read').innerHTML='<div class="para">'+d.s.map(function(s,si){return '<span class="sen" id="sen'+si+'" onclick="readFrom('+si+')">'+s+'</span>'}).join('')+'</div>'
  +'<div class="speak"><button class="sbtn" id="spbtn" onclick="readAll()">🔊 朗读整段</button><button class="sbtn" onclick="stopRead()">■ 停止</button><span style="font-size:.7rem;color:#9A9280;align-self:center">点任意一句，从那句读到段尾</span></div>';
 genBlank();
 renderCue();
 var st=$('stamp');st.classList.toggle('on',!!done[i]);st.textContent=done[i]?'背过了 ✓':'背过了';
 $('list').style.display='none';$('detail').style.display='block';
 tab('read');
 window.scrollTo(0,0);
}
function back(){
 if(window.speechSynthesis){speechSynthesis.cancel();reading=false}
 $('detail').style.display='none';$('list').style.display='block';
 renderList();window.scrollTo(0,0);
}
function tab(t){
 document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
 $('pane-read').style.display=t==='read'?'block':'none';
 $('pane-blank').style.display=t==='blank'?'block':'none';
 $('pane-cue').style.display=t==='cue'?'block':'none';
 stopRead();
}
/* 朗读 */
function speak(sen,si){
 if(!window.speechSynthesis){toast('此浏览器不支持朗读');return}
 var u=new SpeechSynthesisUtterance(sen);
 u.lang='zh-CN';u.rate=.85;
 if(si===DATA[cur].s.length-1){u.onend=function(){clearHot();reading=false}}
 else u.onend=function(){clearHot();speak(DATA[cur].s[si+1],si+1)};
 var el=$('sen'+si);if(el)el.classList.add('hot');
 speechSynthesis.speak(u);
}
function readFrom(si){stopRead();reading=true;speak(DATA[cur].s[si],si)}
function readAll(){stopRead();reading=true;speak(DATA[cur].s[0],0);$('spbtn').classList.add('on');setTimeout(function(){$('spbtn').classList.remove('on')},600)}
function stopRead(){if(window.speechSynthesis)speechSynthesis.cancel();clearHot();reading=false}
function clearHot(){document.querySelectorAll('.sen.hot').forEach(function(e){e.classList.remove('hot')})}
/* 挖空 */
function genBlank(){
 var d=DATA[cur],out='';
 d.s.forEach(function(sen){
  var chars=Array.from(sen),idx=[];
  chars.forEach(function(c,k){if(/[\u4e00-\u9fff0-9a-zA-Z]/.test(c))idx.push(k)});
  var n=Math.round(idx.length*lvl);
  // 均匀取样
  var pick=[];
  if(n>0){var step=idx.length/n;for(var k=0;k<n;k++)pick.push(idx[Math.min(idx.length-1,Math.round(k*step))])}
  var pickset={};pick.forEach(function(k){pickset[k]=1});
  chars.forEach(function(c,k){
   if(pickset[k]&&/[，。！？；：、—""'']/ .test(c)===false && /[\u4e00-\u9fff0-9a-zA-Z]/.test(c)){
    out+='<span class="bk" onclick="rev(this)" data-c="'+c+'">'+c+'</span>';
   } else out+=c;
  });
 });
 $('bz').innerHTML=out;
}
function setLvl(v,el){lvl=v;document.querySelectorAll('.lv').forEach(function(b){b.classList.remove('on')});el.classList.add('on');genBlank()}
function rev(el){el.classList.add('rev')}
/* 提词 */
function renderCue(){
 var d=DATA[cur];
 $('cuebox').innerHTML=d.s.map(function(s){
  var m=s.match(/^[\s]*([\u4e00-\u9fff0-9a-zA-Z「"'《(])/);
  return '<p><b>'+(m?m[1]:'·')+'</b>'+s.replace(/^[\s]*[\u4e00-\u9fff0-9a-zA-Z「"'《(]/,'……')+'</p>';
 }).join('');
}
/* 印章 */
function toggleStamp(){
 done[cur]=!done[cur];
 localStorage.setItem(KEY,JSON.stringify(done));
 var st=$('stamp');st.classList.toggle('on',done[cur]);st.textContent=done[cur]?'背过了 ✓':'背过了';
 if(done[cur])toast('第'+cur+'站盖章 ✦ 已背 '+stampN()+'/'+DATA.length);
 if(stampN()===DATA.length)toast('全部背完！整村导游词属于你了 ✦');
}
renderList();
</script>
</body>
</html>
